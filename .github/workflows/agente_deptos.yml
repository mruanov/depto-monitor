# INFORMATIVO: el scraping real se ejecuta en un Android TV Box con Termux
# (ver README_ANDROID.md). Portal Inmobiliario bloquea las IPs de datacenter
# de GitHub Actions y redirige a /gz/account-verification, por lo que este
# workflow ya no realiza búsquedas ni envía alertas de propiedades.
name: Agente de departamentos (informativo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informar:
    runs-on: ubuntu-latest
    steps:
      - name: Explicar estado del monitoreo
        run: |
          echo "::notice::El monitor corre localmente en Termux (Android TV Box)."
          echo "GitHub Actions no puede acceder a Portal Inmobiliario:"
          echo "las IPs de datacenter son redirigidas a la verificación de cuenta."
          echo "Instrucciones: README_ANDROID.md"
